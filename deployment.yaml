# ── DEPLOYMENT ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinelog
  labels:
    app: cinelog
    version: v2
spec:
  # Número de réplicas do pod rodando simultaneamente
  replicas: 2
  selector:
    matchLabels:
      app: cinelog
  template:
    metadata:
      labels:
        app: cinelog
        version: v2
    spec:
      containers:
        - name: cinelog
          image: ieldias/cinelog:v2
          ports:
            - containerPort: 80
          # Variáveis de ambiente injetadas via Secret do Kubernetes
          env:
            - name: VITE_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cinelog-secrets
                  key: supabase-url
            - name: VITE_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: cinelog-secrets
                  key: supabase-anon-key
            - name: VITE_TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cinelog-secrets
                  key: tmdb-api-key
          # Verifica se o container está respondendo
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          # Limite de recursos do container
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---

# Expõe o Deployment para acesso externo
apiVersion: v1
kind: Service
metadata:
  name: cinelog-service
  labels:
    app: cinelog
spec:
  type: LoadBalancer
  selector:
    app: cinelog
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: v1
kind: Secret
metadata:
  name: cinelog-secrets
type: Opaque
data:
  supabase-url: <BASE64_DA_URL>
  supabase-anon-key: <BASE64_DA_CHAVE>
  tmdb-api-key: <BASE64_DA_CHAVE_TMDB>